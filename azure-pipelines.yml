trigger:
- develop

pool: 
  name: Azure-agent

# stages:
#   - stage: Linting
#     displayName: Linting
jobs:
- job: StaticAnalysis
  displayName: Static Analysis (SonarQube)
  steps:
  - task: SonarQubePrepare@8
    inputs:
      SonarQube: 'SonarQube'
      scannerMode: 'cli'
      configMode: 'manual'
      cliProjectKey: 'ReactTodoUiMonolithic'
      cliProjectName: 'ReactTodoUiMonolithic'
      cliSources: '.'

  - powershell: |
      Write-Host "SONARQUBE_SCANNER_PARAMS:"
      Write-Host $env:SONARQUBE_SCANNER_PARAMS
    displayName: 'Print Sonar Params'

  - task: SonarQubeAnalyze@8
    inputs:
      jdkversion: 'JAVA_HOME_17_X64'


